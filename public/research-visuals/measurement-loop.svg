<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="675" fill="#060606"/>
  <text x="64" y="72" fill="#E6FF00" font-size="15" letter-spacing="5">6SIGNAL — THE AI SEARCH MEASUREMENT PLAYBOOK</text>
  <text x="64" y="126" fill="#f5f5f3" font-size="38" font-weight="700" letter-spacing="1">THE MEASUREMENT CYCLE</text>
  <text x="64" y="160" fill="#6a6a64" font-size="16">Two weeks per cycle. Measurement that doesn't change the work plan is decoration.</text>

  <!-- five stations -->
  <g stroke="#2a2a26" stroke-width="1">
    <rect x="70"  y="300" width="180" height="120" fill="#0e0e0c"/>
    <rect x="300" y="300" width="180" height="120" fill="#0e0e0c"/>
    <rect x="530" y="300" width="180" height="120" fill="#0e0e0c"/>
    <rect x="760" y="300" width="180" height="120" fill="#0e0e0c"/>
    <rect x="990" y="300" width="146" height="120" fill="#0e0e0c" stroke="#E6FF00"/>
  </g>
  <g fill="#6a6a64" font-size="12" letter-spacing="3">
    <text x="94" y="332">STEP 1</text><text x="324" y="332">STEP 2</text><text x="554" y="332">STEP 3</text><text x="784" y="332">STEP 4</text><text x="1010" y="332">STEP 5</text>
  </g>
  <g fill="#f5f5f3" font-size="21" font-weight="700">
    <text x="94" y="368">MEASURE</text><text x="324" y="368">LOG</text><text x="554" y="368">DIAGNOSE</text><text x="784" y="368">FIX</text>
  </g>
  <text x="1010" y="368" fill="#E6FF00" font-size="21" font-weight="700">RETEST</text>
  <g fill="#a8a8a3" font-size="13">
    <text x="94" y="398">Frozen prompts,</text><text x="94" y="382" opacity="0"> </text>
    <text x="94" y="414">five engines</text>
    <text x="324" y="398">Same fields,</text><text x="324" y="414">every run</text>
    <text x="554" y="398">Gaps → lanes,</text><text x="554" y="414">not moods</text>
    <text x="784" y="398">2–3 items,</text><text x="784" y="414">actually shipped</text>
    <text x="1010" y="398">Same prompts.</text><text x="1010" y="414">Deltas only.</text>
  </g>

  <!-- connecting arrows -->
  <g stroke="#5a5a52" stroke-width="2" fill="#5a5a52">
    <line x1="250" y1="360" x2="292" y2="360"/><path d="M292,360 l-9,-5 v10 z"/>
    <line x1="480" y1="360" x2="522" y2="360"/><path d="M522,360 l-9,-5 v10 z"/>
    <line x1="710" y1="360" x2="752" y2="360"/><path d="M752,360 l-9,-5 v10 z"/>
    <line x1="940" y1="360" x2="982" y2="360"/><path d="M982,360 l-9,-5 v10 z"/>
  </g>
  <!-- loop back -->
  <g stroke="#E6FF00" stroke-width="2" fill="none">
    <path d="M1063,420 v90 H160 v-82"/>
  </g>
  <path d="M160,428 l-6,11 h12 z" fill="#E6FF00"/>
  <text x="470" y="538" fill="#E6FF00" font-size="14" letter-spacing="3">EVERY TWO WEEKS — SAME INSTRUMENT</text>

  <text x="64" y="612" fill="#a8a8a3" font-size="15">Three honest numbers per cycle: mention rate · share of voice · win/loss flips.</text>
  <text x="64" y="638" fill="#6a6a64" font-size="14">A prompt set that drifts produces a trendline that lies.</text>
</svg>
