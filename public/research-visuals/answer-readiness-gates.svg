<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="675" fill="#060606"/>
  <text x="64" y="72" fill="#E6FF00" font-size="15" letter-spacing="5">6SIGNAL — THE CONTRACTOR ANSWER-READINESS REPORT</text>
  <text x="64" y="126" fill="#f5f5f3" font-size="38" font-weight="700" letter-spacing="1">WHAT AN ENGINE NEEDS BEFORE IT NAMES YOU</text>
  <text x="64" y="160" fill="#6a6a64" font-size="16">Four gates. Fail any one, and the answer names someone easier to verify.</text>

  <!-- buyer question in -->
  <text x="64" y="248" fill="#a8a8a3" font-size="15">"who should I call</text>
  <text x="64" y="270" fill="#a8a8a3" font-size="15">about a slab leak?"</text>
  <g stroke="#5a5a52" stroke-width="2" fill="#5a5a52">
    <line x1="230" y1="258" x2="268" y2="258"/><path d="M268,258 l-9,-5 v10 z"/>
  </g>

  <!-- gates -->
  <g stroke="#2a2a26" stroke-width="1">
    <rect x="280" y="196" width="196" height="130" fill="#0e0e0c"/>
    <rect x="512" y="196" width="196" height="130" fill="#0e0e0c"/>
    <rect x="744" y="196" width="196" height="130" fill="#0e0e0c"/>
    <rect x="976" y="196" width="160" height="130" fill="#0e0e0c" stroke="#E6FF00"/>
  </g>
  <g fill="#6a6a64" font-size="12" letter-spacing="3">
    <text x="302" y="226">GATE 1</text><text x="534" y="226">GATE 2</text><text x="766" y="226">GATE 3</text><text x="996" y="226">GATE 4</text>
  </g>
  <g fill="#f5f5f3" font-size="22" font-weight="700">
    <text x="302" y="260">IDENTIFY</text><text x="534" y="260">VERIFY</text><text x="766" y="260">MATCH</text>
  </g>
  <text x="996" y="260" fill="#E6FF00" font-size="22" font-weight="700">ROUTE</text>
  <g fill="#a8a8a3" font-size="13">
    <text x="302" y="288">one entity, one story,</text><text x="302" y="306">everywhere it looks</text>
    <text x="534" y="288">specific reviews +</text><text x="534" y="306">corroboration</text>
    <text x="766" y="288">content that answers</text><text x="766" y="306">the actual question</text>
    <text x="996" y="288">a working call or</text><text x="996" y="306">booking path</text>
  </g>
  <g stroke="#5a5a52" stroke-width="2" fill="#5a5a52">
    <line x1="476" y1="258" x2="504" y2="258"/><path d="M504,258 l-9,-5 v10 z"/>
    <line x1="708" y1="258" x2="736" y2="258"/><path d="M736,258 l-9,-5 v10 z"/>
    <line x1="940" y1="258" x2="968" y2="258"/><path d="M968,258 l-9,-5 v10 z"/>
  </g>

  <!-- skip chutes -->
  <g stroke="#3a3a36" stroke-width="1.5" fill="none">
    <path d="M378,326 v78"/><path d="M610,326 v78"/><path d="M842,326 v78"/>
  </g>
  <g fill="#3a3a36">
    <path d="M378,404 l-6,-10 h12 z"/><path d="M610,404 l-6,-10 h12 z"/><path d="M842,404 l-6,-10 h12 z"/>
  </g>
  <g fill="#ef4444" font-size="13" letter-spacing="1">
    <text x="316" y="432">contradictory records</text>
    <text x="556" y="432">"great job!" reviews</text>
    <text x="792" y="432">brochure pages</text>
  </g>
  <g fill="#6a6a64" font-size="13">
    <text x="336" y="454">→ SKIPPED</text><text x="576" y="454">→ SKIPPED</text><text x="812" y="454">→ SKIPPED</text>
  </g>

  <!-- outcome -->
  <rect x="976" y="380" width="160" height="80" fill="#0e0e0c" stroke="#22c55e" stroke-width="1"/>
  <text x="998" y="414" fill="#22c55e" font-size="17" font-weight="700">NAMED IN</text>
  <text x="998" y="438" fill="#22c55e" font-size="17" font-weight="700">THE ANSWER</text>
  <g stroke="#E6FF00" stroke-width="2" fill="none"><path d="M1056,326 v46"/></g>
  <path d="M1056,372 l-6,-10 h12 z" fill="#E6FF00"/>

  <text x="64" y="560" fill="#f5f5f3" font-size="17" font-weight="700">THE UNCOMFORTABLE FINDING:</text>
  <text x="64" y="590" fill="#a8a8a3" font-size="15">The contractors being named are frequently not the best in their market —</text>
  <text x="64" y="614" fill="#E6FF00" font-size="15">they're the most legible. Craft doesn't transmit through a retrieval pipeline. Records do.</text>
</svg>
