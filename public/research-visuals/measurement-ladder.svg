<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="675" fill="#060606"/>
  <text x="64" y="72" fill="#E6FF00" font-size="15" letter-spacing="5">6SIGNAL — THE AI SEARCH MEASUREMENT PLAYBOOK</text>
  <text x="64" y="126" fill="#f5f5f3" font-size="38" font-weight="700" letter-spacing="1">THE FOUR LAYERS OF AN AI ANSWER</text>
  <text x="64" y="160" fill="#6a6a64" font-size="16">Log all four. Each one fails differently — and routes a different fix.</text>

  <!-- four columns -->
  <g>
    <rect x="64" y="210" width="250" height="330" fill="#0e0e0c" stroke="#2a2a26" stroke-width="1"/>
    <rect x="64" y="210" width="250" height="4" fill="#5a5a52"/>
    <text x="88" y="266" fill="#a8a8a3" font-size="13" letter-spacing="3">LAYER 01</text>
    <text x="88" y="308" fill="#f5f5f3" font-size="26" font-weight="700">MENTION</text>
    <text x="88" y="348" fill="#a8a8a3" font-size="15">Your name appears</text>
    <text x="88" y="372" fill="#a8a8a3" font-size="15">anywhere in the answer.</text>
    <text x="88" y="470" fill="#6a6a64" font-size="13" letter-spacing="1">TELLS YOU:</text>
    <text x="88" y="494" fill="#a8a8a3" font-size="14">The engine's model of</text>
    <text x="88" y="514" fill="#a8a8a3" font-size="14">the market includes you.</text>
  </g>
  <g>
    <rect x="354" y="210" width="250" height="330" fill="#0e0e0c" stroke="#2a2a26" stroke-width="1"/>
    <rect x="354" y="210" width="250" height="4" fill="#9c9c00"/>
    <text x="378" y="266" fill="#a8a8a3" font-size="13" letter-spacing="3">LAYER 02</text>
    <text x="378" y="308" fill="#f5f5f3" font-size="26" font-weight="700">RECOMMEND</text>
    <text x="378" y="348" fill="#a8a8a3" font-size="15">Presented as a choice —</text>
    <text x="378" y="372" fill="#a8a8a3" font-size="15">position matters.</text>
    <text x="378" y="470" fill="#6a6a64" font-size="13" letter-spacing="1">TELLS YOU:</text>
    <text x="378" y="494" fill="#a8a8a3" font-size="14">You made the shortlist</text>
    <text x="378" y="514" fill="#a8a8a3" font-size="14">buyers actually act on.</text>
  </g>
  <g>
    <rect x="644" y="210" width="250" height="330" fill="#0e0e0c" stroke="#2a2a26" stroke-width="1"/>
    <rect x="644" y="210" width="250" height="4" fill="#cdde00"/>
    <text x="668" y="266" fill="#a8a8a3" font-size="13" letter-spacing="3">LAYER 03</text>
    <text x="668" y="308" fill="#f5f5f3" font-size="26" font-weight="700">CITATION</text>
    <text x="668" y="348" fill="#a8a8a3" font-size="15">A source is linked or</text>
    <text x="668" y="372" fill="#a8a8a3" font-size="15">attributed — yours or not.</text>
    <text x="668" y="470" fill="#6a6a64" font-size="13" letter-spacing="1">TELLS YOU:</text>
    <text x="668" y="494" fill="#a8a8a3" font-size="14">Where the answer's</text>
    <text x="668" y="514" fill="#a8a8a3" font-size="14">evidence came from.</text>
  </g>
  <g>
    <rect x="934" y="210" width="202" height="330" fill="#0e0e0c" stroke="#2a2a26" stroke-width="1"/>
    <rect x="934" y="210" width="202" height="4" fill="#E6FF00"/>
    <text x="958" y="266" fill="#a8a8a3" font-size="13" letter-spacing="3">LAYER 04</text>
    <text x="958" y="308" fill="#f5f5f3" font-size="26" font-weight="700">SOURCE</text>
    <text x="958" y="348" fill="#a8a8a3" font-size="15">The pages the</text>
    <text x="958" y="372" fill="#a8a8a3" font-size="15">answer drew from.</text>
    <text x="958" y="470" fill="#6a6a64" font-size="13" letter-spacing="1">TELLS YOU:</text>
    <text x="958" y="494" fill="#a8a8a3" font-size="14">Where many of the</text>
    <text x="958" y="514" fill="#a8a8a3" font-size="14">fixes actually live.</text>
  </g>

  <!-- diagnostic patterns -->
  <text x="64" y="596" fill="#E6FF00" font-size="14" letter-spacing="2">RECOMMENDED BUT NEVER CITED → your reputation lives on rented ground.</text>
  <text x="64" y="624" fill="#E6FF00" font-size="14" letter-spacing="2">CITED BUT NEVER RECOMMENDED → a proof problem, not an access problem.</text>
</svg>
