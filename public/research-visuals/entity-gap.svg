<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <rect width="1200" height="675" fill="#060606"/>
  <text x="64" y="66" fill="#E6FF00" font-size="15" letter-spacing="5">6SIGNAL — THE LOCAL ENTITY GAP</text>
  <text x="64" y="118" fill="#f5f5f3" font-size="38" font-weight="700" letter-spacing="1">WHAT THE MACHINE ACTUALLY SEES</text>
  <text x="64" y="150" fill="#6a6a64" font-size="16">Engines cross-check every public record about you. Disagreement doesn't average out — it reads as risk.</text>

  <!-- three records -->
  <g stroke="#2a2a26" stroke-width="1">
    <rect x="64" y="204" width="330" height="216" fill="#0e0e0c"/>
    <rect x="424" y="204" width="330" height="216" fill="#0e0e0c"/>
    <rect x="784" y="204" width="330" height="216" fill="#0e0e0c"/>
  </g>
  <g fill="#a8a8a3" font-size="13" letter-spacing="3">
    <text x="88" y="236">WEBSITE</text><text x="448" y="236">GOOGLE BUSINESS PROFILE</text><text x="808" y="236">DIRECTORIES</text>
  </g>
  <g fill="#f5f5f3" font-size="15">
    <text x="88" y="278">"Plumbing + drains,</text><text x="88" y="300">all of Ellis County"</text>
    <text x="448" y="278">"Plumber,</text><text x="448" y="300">Red Oak only"</text>
    <text x="808" y="278">"Red Oak Plumbing Co."</text><text x="808" y="300">— old phone number</text>
  </g>
  <g fill="#ef4444" font-size="13">
    <text x="88" y="348">≠ service area</text>
    <text x="448" y="348">≠ services listed</text>
    <text x="808" y="348">≠ name · ≠ phone</text>
  </g>
  <g fill="#6a6a64" font-size="13">
    <text x="88" y="392">records last touched:</text>
    <text x="88" y="410">2022 · 2019 · unknown</text>
  </g>

  <!-- convergence to verdict -->
  <g stroke="#3a3a36" stroke-width="1.5" fill="none">
    <path d="M229,420 v60 C229,516 560,500 580,522"/>
    <path d="M589,420 v96"/>
    <path d="M949,420 v60 C949,516 618,500 598,522"/>
  </g>
  <rect x="404" y="524" width="380" height="72" fill="#0c0c0a" stroke="#ef4444" stroke-width="1"/>
  <text x="432" y="556" fill="#ef4444" font-size="16" font-weight="700">ENTITY CONFIDENCE: LOW</text>
  <text x="432" y="580" fill="#a8a8a3" font-size="14">→ the answer names someone else</text>

  <!-- fixed state -->
  <text x="850" y="548" fill="#22c55e" font-size="15" font-weight="700">THE FIX IS BORING:</text>
  <text x="850" y="574" fill="#a8a8a3" font-size="14">same name, services, area,</text>
  <text x="850" y="594" fill="#a8a8a3" font-size="14">phone — everywhere. Verbatim.</text>

  <text x="64" y="646" fill="#E6FF00" font-size="14" letter-spacing="1">The skipped business is often better at the trade — and worse at being legible.</text>
</svg>
