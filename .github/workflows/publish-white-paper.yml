name: Publish white paper (2026-08-01)

# One-shot scheduled publish: merges the `white-paper` branch into main at
# 12:00 UTC on Aug 1 (7:00 a.m. CDT), which triggers the Netlify deploy.
# The cron would also fire Aug 1 of future years — the year guard makes any
# later run a no-op, as does the branch no longer existing.
on:
  schedule:
    - cron: "0 12 1 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge white-paper into main
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then
            echo "Year guard: not 2026, nothing to publish."
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin white-paper >/dev/null 2>&1; then
            echo "Branch white-paper no longer exists, nothing to publish."
            exit 0
          fi
          git config user.name "6signal-publisher"
          git config user.email "hello@6signal.co"
          git fetch origin white-paper
          git merge --no-edit origin/white-paper
          git push origin main
          echo "White paper published."
